# Builds Windows, macOS and Linux downloads for a pushed tag (vX.Y.Z) and attaches them to its release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Test build of Tanooki Test Run."
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, asset: TanookiTestRun-linux-x64.tar.gz }
          - { os: macos-latest, asset: TanookiTestRun-macos-arm64.zip }
          - { os: windows-latest, asset: TanookiTestRun-windows-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = Windows ]; then gcc -O2 -o out/TanookiTestRun.exe main.c && (cd out && 7z a "../${{ matrix.asset }}" .)
          elif [ "$RUNNER_OS" = macOS ]; then cc -O2 -o out/TanookiTestRun main.c && (cd out && zip -r "../${{ matrix.asset }}" .)
          else cc -O2 -o out/TanookiTestRun main.c && tar -czf "${{ matrix.asset }}" -C out .; fi
      - name: Upload
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
